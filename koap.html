<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КоАП Республики Йойград</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="logo">⚖️ РЕСПУБЛИКА ЙОЙГРАД</div>
    <ul>
      <li><a href="index.html">Главная</a></li>
      <li><a href="uk.html">УК</a></li>
      <li><a href="koap.html" class="active">КоАП</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>📘 КоАП</h1>
    <p class="subtitle">Республика Йойград</p>

    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 Поиск по статьям...">
      <select id="jurisdiction">
        <option value="all">Все юрисдикции</option>
        <option value="Административная">Административные</option>
        <option value="Общая">Общие</option>
      </select>
    </div>

    <div class="tabs" id="chapterTabs"></div>
    <div id="articles"></div>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <div id="modalContent"></div>
      <button class="secondary" style="margin-top: 1.5rem;" onclick="document.getElementById('modal').classList.remove('active')">Закрыть</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/koap.js"></script>
  <script src="js/mobile.js"></script>
  <script>
    // Автооткрытие статьи, если пришёл из поиска
    window.addEventListener('load', () => {
      const artNum = sessionStorage.getItem('openArticle');
      const source = sessionStorage.getItem('openSource');
      if (!artNum) return;

      // Проверяем, что статья из нужного документа
      const expectedSource = document.title.includes('КоАП') ? 'КоАП' : 'УК';
      if (source !== expectedSource) return;

      sessionStorage.removeItem('openArticle');
      sessionStorage.removeItem('openSource');

      // Ищем статью
      const data = typeof UK_ARTICLES !== 'undefined' ? UK_ARTICLES :
                   typeof KOAP_ARTICLES !== 'undefined' ? KOAP_ARTICLES : [];
      const idx = data.findIndex(a => a.article === artNum);
      if (idx >= 0 && typeof openArticle === 'function') {
        setTimeout(() => openArticle(idx), 100);
      }
    });
  </script>
</body>
</html>
