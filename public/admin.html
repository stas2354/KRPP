<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка | Республика Йойград</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <div class="logo">⚖️ РЕСПУБЛИКА ЙОЙГРАД</div>
    <ul>
      <li><a href="/">Главная</a></li>
      <li><a href="/admin.html" class="active">Админка</a></li>
      <li><a href="#" id="logoutLink">Выйти</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>🔐 Админ-панель</h1>
    <p class="subtitle">Управление статьями и пользователями</p>

    <div class="tabs">
      <button id="tabPosts" class="active">📜 Статьи</button>
      <button id="tabUsers">👥 Пользователи</button>
    </div>

    <!-- Статьи -->
    <div id="postsSection">
      <div class="admin-layout">
        <div class="panel">
          <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
            <input type="text" id="postsSearch" placeholder="Поиск..." style="margin-bottom:0;">
            <select id="postsCode" style="margin-bottom:0; width:120px;">
              <option value="all">Все</option>
              <option value="uk">УК</option>
              <option value="koap">КоАП</option>
            </select>
          </div>
          <button style="width:100%; margin-bottom:1rem;" onclick="newArticle()">+ Новая статья</button>
          <div id="postsList" style="max-height:600px; overflow-y:auto;"></div>
        </div>

        <div class="panel">
          <h3 id="editorTitle">Выбери статью</h3>
          <div id="editorForm" class="hidden">
            <label>Кодекс *</label>
            <select id="fCode">
              <option value="uk">УК</option>
              <option value="koap">КоАП</option>
            </select>
            <label>Глава</label>
            <input type="text" id="fChapter" placeholder="Глава VI. Против жизни и здоровья">
            <label>Номер статьи *</label>
            <input type="text" id="fArticle" placeholder="6.1">
            <label>Название *</label>
            <input type="text" id="fTitle" placeholder="Убийство">
            <label>Содержание</label>
            <textarea id="fContent" placeholder="Текст статьи..."></textarea>
            <label>Наказание</label>
            <textarea id="fPunishment" placeholder="До 4 лет лишения свободы..." style="min-height:80px;"></textarea>
            <label>Юрисдикция</label>
            <select id="fJurisdiction">
              <option>Общая</option>
              <option>Федеральная</option>
              <option>Региональная</option>
              <option>Военная</option>
              <option>Административная</option>
            </select>
            <label>Розыск (0-5 звёзд)</label>
            <input type="number" id="fWanted" min="0" max="5" value="0">
            <label>Залог (КРРП рублей, пусто если нет)</label>
            <input type="number" id="fBail" placeholder="30000">
            <label>Опубликовано</label>
            <select id="fPublished">
              <option value="1">Да</option>
              <option value="0">Нет</option>
            </select>

            <div id="editorMsg" class="hidden" style="margin-bottom:1rem;"></div>

            <div style="display:flex; gap:0.5rem;">
              <button id="saveBtn">💾 Сохранить</button>
              <button class="secondary" onclick="closeEditor()">Отмена</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Юзеры -->
    <div id="usersSection" class="hidden">
      <div class="admin-layout">
        <div class="panel">
          <h3>Создать пользователя</h3>
          <label>Логин</label>
          <input type="text" id="uUsername">
          <label>Пароль</label>
          <input type="password" id="uPassword">
          <label>Роль</label>
          <select id="uRole">
            <option value="user">Пользователь</option>
            <option value="admin">Админ</option>
          </select>
          <div id="userMsg" class="hidden" style="margin-bottom:1rem;"></div>
          <button id="createUserBtn" style="width:100%;">Создать</button>
        </div>
        <div class="panel">
          <h3>Список пользователей</h3>
          <div id="usersList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
