<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход | Республика Йойград</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <div class="logo">⚖️ РЕСПУБЛИКА ЙОЙГРАД</div>
    <ul><li><a href="/">На главную</a></li></ul>
  </nav>

  <div class="login-box">
    <h2>Вход</h2>
    <p class="subtitle">Для сотрудников администрации</p>
    <div id="error" class="error hidden"></div>
    <label>Логин</label>
    <input type="text" id="username" autocomplete="username">
    <label>Пароль</label>
    <input type="password" id="password" autocomplete="current-password">
    <button style="width:100%;" id="btn">Войти</button>
    <p class="muted" style="margin-top:1rem; font-size:0.8rem;">По умолчанию: admin / admin123</p>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    const btn = document.getElementById('btn');
    const err = document.getElementById('error');

    async function login() {
      err.classList.add('hidden');
      try {
        const data = await api('/api/users/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        Auth.set(data.token, data.user);
        location.href = '/';
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    }

    btn.addEventListener('click', login);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
