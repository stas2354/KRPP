<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход | Республика Йойград</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="logo">⚖️ РЕСПУБЛИКА ЙОЙГРАД</div>
    <button class="burger" id="burger" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
    <ul id="navMenu">
      <li><a href="index.html">Главная</a></li>
      <li><a href="uk.html">УК</a></li>
      <li><a href="koap.html">КоАП</a></li>
      <li><a href="fractions.html">Фракции</a></li>
      <li><a href="favorites.html">⭐ Закладки</a></li>
      <li><a href="login.html" class="active">🔑 Войти</a></li>
    </ul>
    <button id="themeToggle" class="theme-toggle" title="Сменить тему">☀️</button>
  </nav>

  <div class="container">
    <div class="login-box">
      <div class="login-tabs">
        <button class="login-tab active" data-tab="login">Вход</button>
        <button class="login-tab" data-tab="register">Регистрация</button>
      </div>

      <div id="loginForm">
        <h2>Вход</h2>
        <p class="subtitle" style="margin-bottom: 1.5rem;">Войдите в аккаунт</p>

        <div id="loginError" class="error hidden"></div>

        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">

        <label>Пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">

        <button style="width:100%;" id="loginBtn">Войти</button>

        <div class="oauth-sep"><span>или</span></div>

        <button class="oauth-btn" id="googleBtn" style="width:100%;">
          <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align: middle; margin-right: 0.5rem;">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Войти через Google
        </button>
      </div>

      <div id="registerForm" class="hidden">
        <h2>Регистрация</h2>
        <p class="subtitle" style="margin-bottom: 1.5rem;">Создайте аккаунт</p>

        <div id="registerError" class="error hidden"></div>

        <label>Имя пользователя</label>
        <input type="text" id="registerUsername" placeholder="ivan_ivanov" autocomplete="username">

        <label>Email</label>
        <input type="email" id="registerEmail" placeholder="you@example.com" autocomplete="email">

        <label>Пароль (минимум 6 символов)</label>
        <input type="password" id="registerPassword" placeholder="••••••••" autocomplete="new-password">

        <button style="width:100%;" id="registerBtn">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Переключение вкладок
    document.querySelectorAll('.login-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById('loginForm').classList.toggle('hidden', target !== 'login');
        document.getElementById('registerForm').classList.toggle('hidden', target !== 'register');
      });
    });

    // Вход
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');
      err.classList.add('hidden');

      if (!email || !password) {
        err.textContent = 'Заполни все поля';
        err.classList.remove('hidden');
        return;
      }

      const { error } = await signIn(email, password);
      if (error) {
        err.textContent = error.message;
        err.classList.remove('hidden');
        return;
      }

      window.location.href = 'profile.html';
    });

    // Регистрация
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const username = document.getElementById('registerUsername').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const err = document.getElementById('registerError');
      err.classList.add('hidden');

      if (!username || !email || !password) {
        err.textContent = 'Заполни все поля';
        err.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        err.textContent = 'Пароль минимум 6 символов';
        err.classList.remove('hidden');
        return;
      }

      const { error } = await signUp(email, password, username);
      if (error) {
        err.textContent = error.message;
        err.classList.remove('hidden');
        return;
      }

      alert('Аккаунт создан! Проверь почту и подтверди email, потом войди.');
      document.querySelector('[data-tab="login"]').click();
    });

    // Google OAuth
    document.getElementById('googleBtn').addEventListener('click', async () => {
      await signInWithGoogle();
    });

    // Если уже залогинен — на профиль
    (async () => {
      const user = await getUser();
      if (user) window.location.href = 'profile.html';
    })();
  </script>
  <script src="js/mobile.js"></script>
</body>
</html>
