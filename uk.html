<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>УК Республики Йойград</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="logo">⚖️ РЕСПУБЛИКА ЙОЙГРАД</div>
    <button class="burger" id="burger" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
    <ul id="navMenu">
      <li><a href="index.html">Главная</a></li>
      <li><a href="uk.html" class="active">УК</a></li>
      <li><a href="koap.html">КоАП</a></li>
      <li><a href="fractions.html">Фракции</a></li>
      <li><a href="favorites.html">⭐ Закладки</a></li>
      <li><a href="login.html" id="profileLink">🔑 Войти</a></li>
    </ul>
    <button id="themeToggle" class="theme-toggle" title="Сменить тему">☀️</button>
  </nav>

  <div class="container">
    <h1>📕 Уголовный кодекс</h1>
    <p class="subtitle">Республика Йойград</p>

    <div class="filters-row">
      <input type="text" id="search" placeholder="🔍 Поиск по статьям...">
      <select id="chapterSelect">
        <option value="all">📖 Все главы</option>
      </select>
      <select id="jurisdiction">
        <option value="all">Все юрисдикции</option>
        <option value="Федеральная">Федеральные</option>
        <option value="Региональная">Региональные</option>
        <option value="Военная">Военные</option>
        <option value="Общая">Общие</option>
      </select>
    </div>

    <div class="articles-count" id="count"></div>
    <div id="articles"></div>
  </div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <div id="modalContent"></div>
      <button class="secondary" style="margin-top: 1.5rem;" onclick="document.getElementById('modal').classList.remove('active')">Закрыть</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data-uk.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/uk.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav-auth.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
